packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - supabase
  - unrs-resolver
  - workerd

# pnpm 11 usa a forma granular; mantemos ambas para o Corepack 10.15.1 das imagens.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  supabase: true
  unrs-resolver: true
  workerd: true
