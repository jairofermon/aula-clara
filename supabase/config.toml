project_id = "aula-clara"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://aula-clara.jairofermon.workers.dev"
additional_redirect_urls = [
  "https://aula-clara.jairofermon.workers.dev/auth/callback",
  "https://aula-clara.jairofermon.workers.dev/reset-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
